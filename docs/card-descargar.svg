<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .drop { animation: drop 1.8s ease-in-out infinite; }
    @keyframes drop { 0%{transform:translateY(-14px);opacity:0} 30%{opacity:1} 70%{transform:translateY(6px);opacity:1} 100%{transform:translateY(10px);opacity:0} }
    .ring { animation: ring 3.6s ease-in-out infinite; }
    @keyframes ring { from { stroke-dashoffset: 565; } to { stroke-dashoffset: 0; } }
  </style>
  <rect width="600" height="300" rx="24" fill="#1C1C1E"/>
  <rect x=".5" y=".5" width="599" height="299" rx="24" fill="none" stroke="#2E2E30"/>

  <text x="40" y="62" font-size="13" letter-spacing="3" fill="#9A9AA0" font-weight="600">03 · DESCARGAR</text>
  <text x="40" y="108" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-.6">Llévatela</text>
  <text font-size="17" fill="#9A9AA0">
    <tspan x="40" y="160">Canciones o álbumes completos,</tspan>
    <tspan x="40" y="186">con portada y toda su info,</tspan>
    <tspan x="40" y="212">listos para escuchar sin red.</tspan>
  </text>

  <!-- anillo de progreso -->
  <circle cx="470" cy="150" r="90" fill="#121212"/>
  <circle cx="470" cy="150" r="90" fill="none" stroke="#2E2E30" stroke-width="8"/>
  <circle class="ring" cx="470" cy="150" r="90" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="565" transform="rotate(-90 470 150)"/>

  <!-- flecha -->
  <g class="drop" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 108 v52"/>
    <path d="M446 138 l24 24 l24 -24"/>
  </g>
  <path d="M436 186 h68" stroke="#E5484D" stroke-width="9" stroke-linecap="round"/>
</svg>
