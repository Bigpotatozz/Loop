<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .heart { transform-box: fill-box; transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.18)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  </style>
  <rect width="600" height="300" rx="24" fill="#1C1C1E"/>
  <rect x=".5" y=".5" width="599" height="299" rx="24" fill="none" stroke="#2E2E30"/>

  <text x="40" y="62" font-size="13" letter-spacing="3" fill="#9A9AA0" font-weight="600">04 · ORGANIZAR</text>
  <text x="40" y="108" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-.6">A tu manera</text>
  <text font-size="17" fill="#9A9AA0">
    <tspan x="40" y="160">Playlists con portadas que se</tspan>
    <tspan x="40" y="186">arman solas con sus canciones,</tspan>
    <tspan x="40" y="212">y favoritos a un toque.</tspan>
  </text>

  <!-- playlists apiladas -->
  <g transform="rotate(-10 470 150)">
    <rect x="392" y="74" width="156" height="156" rx="18" fill="#2E2E30"/>
  </g>
  <g transform="rotate(-4 470 150)">
    <rect x="392" y="74" width="156" height="156" rx="18" fill="#3A3A3D"/>
  </g>
  <!-- portada mosaico 2x2 -->
  <g transform="rotate(3 470 150)">
    <clipPath id="c"><rect x="392" y="72" width="156" height="156" rx="18"/></clipPath>
    <g clip-path="url(#c)">
      <rect x="392" y="72" width="78" height="78" fill="#F4F0F0"/>
      <rect x="470" y="72" width="78" height="78" fill="#121212"/>
      <rect x="392" y="150" width="78" height="78" fill="#5A5A60"/>
      <rect x="470" y="150" width="78" height="78" fill="#9A9AA0"/>
      <circle cx="431" cy="111" r="20" fill="#121212"/>
      <path d="M494 96 h30 v30 h-30z" fill="none" stroke="#F4F0F0" stroke-width="4"/>
      <path d="M402 214 l29 -40 l29 40z" fill="#F4F0F0"/>
    </g>
  </g>
  <!-- corazón -->
  <circle cx="548" cy="232" r="26" fill="#FFFFFF"/>
  <path class="heart" d="M548 244 c-14 -9 -20 -16 -20 -23 c0 -6 5 -10 10 -10 c4 0 8 2 10 6 c2 -4 6 -6 10 -6 c5 0 10 4 10 10 c0 7 -6 14 -20 23z" fill="#E5484D"/>
</svg>
