<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .prog { animation: fill 3s linear infinite; }
    @keyframes fill { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
  </style>
  <rect width="600" height="300" rx="24" fill="#1C1C1E"/>
  <rect x=".5" y=".5" width="599" height="299" rx="24" fill="none" stroke="#2E2E30"/>

  <text x="40" y="62" font-size="13" letter-spacing="3" fill="#9A9AA0" font-weight="600">02 · DESCUBRIR</text>
  <text x="40" y="108" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-.6">Lo que suena hoy</text>
  <text font-size="17" fill="#9A9AA0">
    <tspan x="40" y="160">Lo más escuchado en tu país.</tspan>
    <tspan x="40" y="186">Prueba 30 segundos de cualquier</tspan>
    <tspan x="40" y="212">canción y explora artistas.</tspan>
  </text>

  <!-- ranking -->
  <g font-size="14">
    <g transform="translate(372 58)">
      <rect width="196" height="52" rx="12" fill="#232325"/>
      <text x="16" y="32" font-weight="700" fill="#FFFFFF">1</text>
      <rect x="36" y="10" width="32" height="32" rx="7" fill="#E5484D"/>
      <rect x="80" y="16" width="70" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="80" y="30" width="46" height="7" rx="3.5" fill="#5A5A60"/>
      <!-- preview 0:30 -->
      <circle cx="174" cy="26" r="12" fill="none" stroke="#2E2E30" stroke-width="3"/>
      <circle class="prog" cx="174" cy="26" r="12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="76 120" stroke-linecap="round" transform="rotate(-90 174 26)"/>
    </g>
    <g transform="translate(372 122)">
      <rect width="196" height="52" rx="12" fill="#232325"/>
      <text x="16" y="32" font-weight="700" fill="#9A9AA0">2</text>
      <rect x="36" y="10" width="32" height="32" rx="7" fill="#F4F0F0"/>
      <rect x="80" y="16" width="62" height="8" rx="4" fill="#D0D0D4"/>
      <rect x="80" y="30" width="40" height="7" rx="3.5" fill="#5A5A60"/>
    </g>
    <g transform="translate(372 186)">
