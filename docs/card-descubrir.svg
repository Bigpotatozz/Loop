      <text x="16" y="32" font-weight="700" fill="#9A9AA0">3</text>
      <rect x="36" y="10" width="32" height="32" rx="7" fill="#5A5A60"/>
      <rect x="80" y="16" width="78" height="8" rx="4" fill="#D0D0D4"/>
      <rect x="80" y="30" width="50" height="7" rx="3.5" fill="#5A5A60"/>
    </g>
    <rect x="490" y="250" width="78" height="26" rx="13" fill="#FFFFFF"/>
    <text x="529" y="268" font-size="13" font-weight="700" fill="#121212" text-anchor="middle">▶ 0:30</text>
  </g>
