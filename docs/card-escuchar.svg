<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .spin { transform-origin: 470px 150px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <rect width="600" height="300" rx="24" fill="#1C1C1E"/>
  <rect x=".5" y=".5" width="599" height="299" rx="24" fill="none" stroke="#2E2E30"/>

  <text x="40" y="62" font-size="13" letter-spacing="3" fill="#9A9AA0" font-weight="600">01 · ESCUCHAR</text>
  <text x="40" y="108" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-.6">Tu biblioteca</text>
  <text font-size="17" fill="#9A9AA0">
    <tspan x="40" y="160">Toda tu música aparece sola.</tspan>
    <tspan x="40" y="186">Sigue sonando en segundo</tspan>
    <tspan x="40" y="212">plano, con aleatorio y repetición.</tspan>
  </text>

  <!-- vinilo -->
  <g class="spin">
    <circle cx="470" cy="150" r="100" fill="#0B0B0C"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".07">
      <circle cx="470" cy="150" r="90"/><circle cx="470" cy="150" r="80"/>
      <circle cx="470" cy="150" r="70"/><circle cx="470" cy="150" r="60"/>
      <circle cx="470" cy="150" r="50"/>
    </g>
    <path d="M470 50 A100 100 0 0 1 560 105" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
    <circle cx="470" cy="150" r="34" fill="#E5484D"/>
    <text x="470" y="141" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LOOP</text>
    <text x="470" y="167" font-size="8" fill="#FFFFFF" fill-opacity=".7" text-anchor="middle">LADO A</text>
    <circle cx="470" cy="150" r="4" fill="#1C1C1E"/>
  </g>
</svg>
