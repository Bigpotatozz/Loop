<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 420" width="1280" height="420">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.1s ease-in-out infinite alternate; }
    .b1{animation-delay:-.1s}.b2{animation-delay:-.5s}.b3{animation-delay:-.9s}.b4{animation-delay:-.3s}
    .b5{animation-delay:-.7s}.b6{animation-delay:-.2s}.b7{animation-delay:-.8s}.b8{animation-delay:-.4s}
    .b9{animation-delay:-.6s}.b10{animation-delay:-1s}.b11{animation-delay:-.35s}.b12{animation-delay:-.75s}
    @keyframes eq { 0%{transform:scaleY(.25)} 50%{transform:scaleY(.9)} 100%{transform:scaleY(.45)} }
    .knob { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#E5484D" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#121212"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- icono -->
    <image x="88" y="78" width="132" height="132" href="data:image/webp;base64,"/>

    <!-- textos -->
    <text x="252" y="128" font-size="15" letter-spacing="4" fill="#9A9AA0" font-weight="600">REPRODUCTOR DE MÚSICA · ANDROID</text>
    <text x="250" y="178" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-1.2">Lo que tienes, lo que suena</text>
    <text x="250" y="230" font-size="46" font-weight="700" fill="#5A5A60" letter-spacing="-1.2">y lo que viene.</text>

    <!-- ecualizador -->
    <g fill="#FFFFFF">
      <rect class="bar b1"  x="930"  y="110" width="14" height="140" rx="7"/>
      <rect class="bar b2"  x="954"  y="90"  width="14" height="160" rx="7"/>
      <rect class="bar b3"  x="978"  y="130" width="14" height="120" rx="7"/>
      <rect class="bar b4"  x="1002" y="70"  width="14" height="180" rx="7"/>
      <rect class="bar b5"  x="1026" y="100" width="14" height="150" rx="7"/>
      <rect class="bar b6"  x="1050" y="60"  width="14" height="190" rx="7" fill="#E5484D"/>
      <rect class="bar b7"  x="1074" y="95"  width="14" height="155" rx="7"/>
      <rect class="bar b8"  x="1098" y="120" width="14" height="130" rx="7"/>
      <rect class="bar b9"  x="1122" y="80"  width="14" height="170" rx="7"/>
      <rect class="bar b10" x="1146" y="115" width="14" height="135" rx="7"/>
      <rect class="bar b11" x="1170" y="140" width="14" height="110" rx="7"/>
      <rect class="bar b12" x="1194" y="125" width="14" height="125" rx="7"/>
    </g>

    <!-- barra de reproducción -->
    <line x1="88" y1="318" x2="1192" y2="318" stroke="#2E2E30" stroke-width="6" stroke-linecap="round"/>
    <line x1="88" y1="318" x2="520" y2="318" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle class="knob" cx="520" cy="318" r="10" fill="#FFFFFF"/>
    <text x="88" y="356" font-size="15" fill="#9A9AA0">1:24</text>
    <text x="1192" y="356" font-size="15" fill="#9A9AA0" text-anchor="end">3:45</text>

    <!-- controles -->
    <g transform="translate(640 356)" fill="#FFFFFF">
      <path d="M-78 -12 l-14 12 l14 12 z M-96 -12 h4 v24 h-4 z" fill="#9A9AA0"/>
      <circle cx="0" cy="0" r="20"/>
      <path d="M-6 -9 v18 l14 -9 z" fill="#121212"/>
      <path d="M78 -12 l14 12 l-14 12 z M92 -12 h4 v24 h-4 z" fill="#9A9AA0"/>
    </g>
  </g>
</svg>
